name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  analysis:
    name: Analysis
    uses: ./.github/workflows/analysis.yaml

  tests:
    name: Tests
    needs: analysis
    uses: ./.github/workflows/tests.yaml

  validate-main:
    name: Validate Current Main
    if: github.ref == 'refs/heads/main'
    needs:
      - analysis
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tested-main.outputs.sha }}
    steps:
      - name: Check out live main for validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record tested main
        id: tested-main
        run: echo "sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: LINT - go
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          working-directory: ./

      - name: Test
        run: go test ./...

      - name: Compile
        run: go build -o "$RUNNER_TEMP/emberfall" .

      - id: setup-bats
        uses: bats-core/bats-action@3.0.0

      - name: Test CLI
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: |
          ln -s "$GITHUB_WORKSPACE/tests" ./tests
          bats "$GITHUB_WORKSPACE/tests/cli.bats"

  release:
    name: Prepare and Publish Release
    if: github.ref == 'refs/heads/main'
    needs: validate-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_needed: ${{ steps.release.outputs.release_needed }}
      previous_version: ${{ steps.release.outputs.previous_version }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      bump: ${{ steps.release.outputs.bump }}
    steps:
      - name: Check out tested main without release credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pre-auth checkout is tested main
        env:
          TESTED_MAIN_SHA: ${{ needs.validate-main.outputs.sha }}
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$TESTED_MAIN_SHA"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Authenticate tested main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify authenticated checkout is tested main
        env:
          TESTED_MAIN_SHA: ${{ needs.validate-main.outputs.sha }}
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$TESTED_MAIN_SHA"

      - name: Configure release bot identity
        run: |
          git config user.name "emberfall-release[bot]"
          git config user.email "emberfall-release[bot]@users.noreply.github.com"

      - name: Prepare release
        id: release
        run: go run ./cmd/emberfall-release prepare --github-output "$GITHUB_OUTPUT"

      - name: Build proposed release
        if: steps.release.outputs.release_needed == 'true'
        env:
          PROPOSED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          go build -o "$RUNNER_TEMP/emberfall" .
          actual_version="$("$RUNNER_TEMP/emberfall" --version)"
          test "$actual_version" = "emberfall version $PROPOSED_VERSION"

      - name: Publish release
        if: steps.release.outputs.release_needed == 'true'
        env:
          PROPOSED_VERSION: ${{ steps.release.outputs.version }}
        run: go run ./cmd/emberfall-release publish --version "$PROPOSED_VERSION"
