name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compile:
    name: Compile and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Generate release notes
      run: go run ./cmd/emberfall-release notes --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
    
    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: v2.17.1
        args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  enhance-notes:
    name: Enhance Release Notes
    needs: compile
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Enhance release notes
      continue-on-error: true
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
      run: |
        if [[ -z "$ANTHROPIC_API_KEY" ]]; then
          echo "ANTHROPIC_API_KEY is not configured; skipping release-note enhancement."
          exit 0
        fi
        go run ./cmd/emberfall-release enhance-notes --tag "$GITHUB_REF_NAME"
